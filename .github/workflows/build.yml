name: Build and Release

permissions:
  contents: read

env:
  APP_FILE: EDOPal

on:
  push:
    branches: ['release-test/**']
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    outputs:
      display_name: ${{ steps.release_version.outputs.display_name }}
      version: ${{ steps.release_version.outputs.value }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-15
            platform: macOS
          - os: ubuntu-22.04
            platform: Linux

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      if: runner.os != 'macOS'
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Set up universal2 Python on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        curl --fail --silent --show-error --location \
          https://www.python.org/ftp/python/3.13.13/python-3.13.13-macos11.pkg \
          --output "$RUNNER_TEMP/python.pkg"
        echo "a909cb655af5db67d5a90b3603437a1d58bec3446d624e4034e278ac62023cc9  $RUNNER_TEMP/python.pkg" \
          | shasum -a 256 -c
        sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
        mkdir -p "$RUNNER_TEMP/universal-python"
        ln -s /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 \
          "$RUNNER_TEMP/universal-python/python"
        echo "$RUNNER_TEMP/universal-python" >> "$GITHUB_PATH"

    - name: Determine release version
      id: release_version
      shell: bash
      run: |
        version="$(tr -d '\r\n' < VERSION)"
        if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "::error::Release tag must match VERSION ($version)."
          exit 1
        fi
        echo "value=$version" >> "$GITHUB_OUTPUT"
        python -c "from config import APP_NAME; print('display_name=' + APP_NAME)" >> "$GITHUB_OUTPUT"

    - name: Install Qt runtime and headless displays before dependency analysis
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libxcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
          libxcb-randr0 libxcb-render0 libxcb-render-util0 libxcb-shape0 \
          libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xkb1 libxcb-glx0 \
          libx11-6 libx11-xcb1 libxkbcommon0 libxkbcommon-x11-0 \
          libegl1 libgl1 libgl1-mesa-dri libwayland-client0 libwayland-cursor0 libwayland-egl1 \
          libdbus-1-3 libfontconfig1 libfreetype6 libglib2.0-0 libzstd1 libstdc++6 \
          xvfb xauth weston

    - name: Install Dependencies
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          # PyPI's default wheels for these packages carry only the current CPU.
          # Use the macOS SDK's universal libffi for cffi and the audio backend.
          PKG_CONFIG=/usr/bin/false ARCHFLAGS="-arch arm64 -arch x86_64" MACOSX_DEPLOYMENT_TARGET=14.4 \
            python -m pip install --no-cache-dir --no-binary aiohttp,frozenlist,multidict,propcache,yarl,cffi,miniaudio \
            -r requirements.txt
        else
          python -m pip install -r requirements.txt
        fi
        python -m pip install pyinstaller==6.20.0 pillow==13.0.0

    - name: Build and inspect the one-file release
      run: python -m tools.release build

    - name: Test extracted Windows GUI executable
      if: runner.os == 'Windows'
      env:
        QT_QPA_PLATFORM: windows
      run: python -m tools.release verify

    - name: Test extracted Cocoa app on Apple Silicon and Intel
      if: runner.os == 'macOS'
      env:
        QT_QPA_PLATFORM: cocoa
      run: |
        if ! arch -x86_64 /usr/bin/true; then
          sudo softwareupdate --install-rosetta --agree-to-license
        fi
        python -m tools.release verify

    - name: Test extracted Linux executable on X11
      if: runner.os == 'Linux'
      run: xvfb-run -a -s "-screen 0 1280x800x24" env QT_QPA_PLATFORM=xcb python -m tools.release verify

    - name: Test extracted Linux executable on Wayland
      if: runner.os == 'Linux'
      shell: bash
      run: |
        export XDG_RUNTIME_DIR="$(mktemp -d)"
        export WAYLAND_DISPLAY=edopal-test
        weston --backend=headless-backend.so --width=1280 --height=800 --socket="$WAYLAND_DISPLAY" --idle-time=0 \
          --no-config --log="$RUNNER_TEMP/weston.log" &
        compositor=$!
        trap 'kill "$compositor" 2>/dev/null || true' EXIT
        for _ in {1..100}; do
          [[ -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]] && break
          kill -0 "$compositor" 2>/dev/null || break
          sleep 0.1
        done
        if [[ ! -S "$XDG_RUNTIME_DIR/$WAYLAND_DISPLAY" ]]; then
          cat "$RUNNER_TEMP/weston.log"
          exit 1
        fi
        env -u DISPLAY QT_QPA_PLATFORM=wayland python -m tools.release verify

    - name: Upload the verified release zip
      uses: actions/upload-artifact@v7
      with:
        name: zip-${{ matrix.platform }}
        path: dist/${{ env.APP_FILE }}-${{ matrix.platform }}-v${{ steps.release_version.outputs.value }}.zip
        if-no-files-found: error
        compression-level: 0

  # A manual dispatch can select a tag too. Only a pushed version tag can publish.
  release:
    name: Publish the release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: zip-*
        merge-multiple: true

    - name: Require exactly one verified asset per platform
      env:
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        expected = {f"{os.environ['APP_FILE']}-{p}-v{os.environ['VERSION']}.zip"
                    for p in ("Windows", "macOS", "Linux")}
        actual = {p.name for p in Path("dist").iterdir()}
        if actual != expected:
            raise SystemExit(f"Missing {expected - actual}, unexpected {actual - expected}")
        PY

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ needs.build.outputs.display_name }} v${{ needs.build.outputs.version }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: dist/*.zip
