name: Build and Release

permissions:
  contents: read

env:
  APP_FILE: EDOPal

on:
  push:
    branches: ['release-test/**']
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    outputs:
      display_name: ${{ steps.release_version.outputs.display_name }}
      version: ${{ steps.release_version.outputs.value }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
          - os: macos-15
            platform: macOS
          - os: ubuntu-22.04
            platform: Linux

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      if: runner.os != 'macOS'
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Set up universal2 Python on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        curl --fail --silent --show-error --location \
          https://www.python.org/ftp/python/3.13.13/python-3.13.13-macos11.pkg \
          --output "$RUNNER_TEMP/python.pkg"
        echo "a909cb655af5db67d5a90b3603437a1d58bec3446d624e4034e278ac62023cc9  $RUNNER_TEMP/python.pkg" \
          | shasum -a 256 -c
        sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
        mkdir -p "$RUNNER_TEMP/universal-python"
        ln -s /Library/Frameworks/Python.framework/Versions/3.13/bin/python3 \
          "$RUNNER_TEMP/universal-python/python"
        echo "$RUNNER_TEMP/universal-python" >> "$GITHUB_PATH"

    - name: Determine release version
      id: release_version
      shell: bash
      run: |
        version="$(tr -d '\r\n' < VERSION)"
        if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
          echo "::error::Release tag must match VERSION ($version)."
          exit 1
        fi
        echo "value=$version" >> "$GITHUB_OUTPUT"
        python -c "from config import APP_NAME; print('display_name=' + APP_NAME)" >> "$GITHUB_OUTPUT"

    - name: Install Qt runtime and headless displays before dependency analysis
      if: runner.os == 'Linux'
      run: bash .github/workflows/qt-linux.sh xvfb xauth weston

    - name: Install Dependencies
      shell: bash
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          # PyPI's default wheels for these packages carry only the current CPU.
          # Use the macOS SDK's universal libffi for cffi and the audio backend.
          PKG_CONFIG=/usr/bin/false ARCHFLAGS="-arch arm64 -arch x86_64" MACOSX_DEPLOYMENT_TARGET=14.4 \
            python -m pip install --no-cache-dir --no-binary aiohttp,frozenlist,multidict,propcache,yarl,cffi,miniaudio \
            -r requirements.txt
        else
          python -m pip install -r requirements.txt
        fi
        python -m pip install pyinstaller==6.20.0 pillow==13.0.0

    - name: Build and inspect the one-file release
      run: python -m tools.release build

    - name: Test extracted Windows GUI executable
      if: runner.os == 'Windows'
      env:
        QT_QPA_PLATFORM: windows
      run: python -m tools.release verify

    - name: Test extracted Cocoa app on Apple Silicon and Intel
      if: runner.os == 'macOS'
      env:
        QT_QPA_PLATFORM: cocoa
      run: |
        if ! arch -x86_64 /usr/bin/true; then
          sudo softwareupdate --install-rosetta --agree-to-license
        fi
        python -m tools.release verify

    - name: Test extracted Linux executable on X11 and Wayland
      if: runner.os == 'Linux'
      run: bash .github/workflows/verify-linux-displays.sh headless-backend.so

    - name: Upload the verified release zip
      uses: actions/upload-artifact@v7
      with:
        name: zip-${{ matrix.platform }}
        path: dist/${{ env.APP_FILE }}-${{ matrix.platform }}-v${{ steps.release_version.outputs.value }}.zip
        if-no-files-found: error
        compression-level: 0

  screenshots:
    name: Overview on ${{ matrix.os }} (${{ matrix.platform }})
    if: >-
      github.ref_type == 'branch' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-test/')))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: offscreen
          - os: ubuntu-latest
            platform: xcb
          - os: macos-latest
            platform: cocoa
    env:
      QT_QPA_PLATFORM: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install Qt runtime, fonts and X server
      if: runner.os == 'Linux'
      run: bash .github/workflows/qt-linux.sh xvfb xauth

    - name: Install renderer dependencies
      run: python -m pip install -r requirements.txt pillow==13.0.0

    - name: Render overview at 1280 by 800
      shell: bash
      run: |
        command=(python tools/studio_screenshots.py --size 1280x800 --out build/overview)
        if [[ "$QT_QPA_PLATFORM" == xcb ]]; then
          xvfb-run -a -s "-screen 0 1280x800x24" "${command[@]}"
        else
          "${command[@]}"
        fi

    - name: Verify PNG dimensions and normalize Retina captures
      shell: python
      run: |
        from pathlib import Path
        import sys
        from PIL import Image

        folder = Path("build/overview/1280x800")
        if not (folder / "01-hd-cards.png").is_file():
            raise SystemExit("Missing HD Cards overview")
        for path in sorted(folder.glob("*.png")):
            with Image.open(path) as image:
                image.load()
                if image.format != "PNG":
                    raise SystemExit(f"Unexpected format in {path}")
                if image.size == (1280, 800):
                    continue
                if sys.platform != "darwin" or image.size != (2560, 1600):
                    raise SystemExit(f"Unexpected capture size {image.size} in {path}")
                scaled = image.resize((1280, 800), Image.Resampling.LANCZOS)
            scaled.save(path)

    - uses: actions/upload-artifact@v7
      with:
        name: overview-${{ matrix.os }}-${{ matrix.platform }}-1280x800
        path: build/overview/1280x800/*.png
        if-no-files-found: error
        retention-days: 7
        compression-level: 0

  linux-compatibility:
    name: Test the released Linux zip on ubuntu-latest
    needs: build
    if: >-
      github.ref_type == 'branch' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release-test/')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - uses: actions/download-artifact@v8
      with:
        name: zip-Linux
        path: dist
    - name: Install host display libraries and archive inspector
      run: |
        bash .github/workflows/qt-linux.sh xvfb xauth weston
        python -m pip install pyinstaller==6.20.0
    - name: Test the downloaded zip on X11 and Wayland
      run: bash .github/workflows/verify-linux-displays.sh headless

  # A manual dispatch can select a tag too. Only a pushed version tag can publish.
  release:
    name: Publish the release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: zip-*
        merge-multiple: true

    - name: Require exactly one verified asset per platform
      env:
        VERSION: ${{ needs.build.outputs.version }}
      run: |
        python - <<'PY'
        import os
        from pathlib import Path
        expected = {f"{os.environ['APP_FILE']}-{p}-v{os.environ['VERSION']}.zip"
                    for p in ("Windows", "macOS", "Linux")}
        actual = {p.name for p in Path("dist").iterdir()}
        if actual != expected:
            raise SystemExit(f"Missing {expected - actual}, unexpected {actual - expected}")
        PY

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        name: ${{ needs.build.outputs.display_name }} v${{ needs.build.outputs.version }}
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: dist/*.zip
