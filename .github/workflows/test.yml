name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Ruff and pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2025, macos-15]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTEST_QT_API: pyside6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packaging/requirements-py312.lock
      - name: Install Linux display libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 fonts-dejavu-core
      - name: Install the app and test tools
        run: |
          python -m pip install -c packaging/requirements-py312.lock setuptools
          python -m pip install --no-build-isolation -c packaging/requirements-py312.lock ".[dev]"
      - run: python -m ruff check src tests tools packaging
      - run: python -m ruff format --check src tests tools packaging
      - run: python -m pytest -q
