[project]
name = "edopal"
dynamic = ["version"]
description = "EDOPal: the EDOPro companion. HD card art, themes, music and classic formats."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "PySide6-Essentials>=6.9",
  "aiohttp>=3.10",
  "certifi",
  "miniaudio>=1.60",
  "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "ruff==0.15.15"]

[project.gui-scripts]
edopal = "edopal.app:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "edopal.__version__" }

[tool.setuptools.package-data]
edopal = ["assets/**/*"]
"edopal.plugins.decktracker" = ["*.webp"]
"edopal.features.formats.builder" = ["inputs/*.json", "inputs/*.json.gz"]

[tool.ruff]
line-length = 125
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
qt_api = "pyside6"
